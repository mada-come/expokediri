<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0E1A">
<title>Kediri ke Seberang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Konsep: cerita bergaya slide foto TikTok. Tiap produk punya maskot low-poly, teks pendek, satu ide per slide. */
:root{
  --fd:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --fb:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ink:#0C0E1A; --kn:#F2B01E; --ind:#2A3CA6;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:#fff;font:400 17px/1.5 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:8px}
svg{display:block}

/* ===== beranda (rapi, minimal) ===== */
.home{min-height:100dvh;max-width:1080px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 48px max(20px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{font:800 17px var(--fd);letter-spacing:-.02em}
.links{display:flex;gap:18px;font-size:14.5px;font-weight:600;color:#B7BBD0}
.links a{text-decoration:none;color:inherit}
.links a:hover{color:#fff}
#mine{max-width:300px;width:100%}
.hero{display:grid;gap:36px;padding:clamp(32px,6vw,72px) 0 clamp(40px,6vw,64px);align-items:center}
@media(min-width:820px){.hero{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:64px}#mine{max-width:380px}}
.kicker{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--kn)}
.home h1{margin-top:14px;font:800 clamp(38px,5.4vw,64px)/1.02 var(--fd);letter-spacing:-.035em;text-wrap:balance}
.lede{margin-top:18px;font-size:18px;color:#A7ACC4;max-width:34ch}
.pic{position:relative;display:block;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#151937;color:#fff;text-decoration:none;box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-content:center;gap:6px;text-align:center;padding:24px;color:#8E93AE;font-size:14.5px}
.ph b{font:800 22px var(--fd);color:#fff}
.ph[hidden]{display:none}
.tag{position:absolute;left:14px;bottom:14px;font-size:13px;font-weight:700;padding:8px 13px;border-radius:99px;background:rgba(12,14,26,.8)}
.sec{padding:clamp(36px,5vw,56px) 0;border-top:1px solid rgba(255,255,255,.08)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.sec-h h2{font:800 clamp(24px,3vw,30px)/1.1 var(--fd);letter-spacing:-.025em}
.sec-h span{color:#8E93AE;font-size:15px}
.posters{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.posters{gap:22px}}
.poster{position:relative;display:block;width:100%;aspect-ratio:360/396;border-radius:18px;overflow:hidden;isolation:isolate;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.poster{outline:2px solid rgba(242,176,30,.85);outline-offset:4px}
.poster:hover{transform:translateY(-4px);outline-color:#FFD04F}
.poster:focus-visible{outline-color:#fff}
.poster svg{position:absolute;inset:0;width:100%;height:100%}
.poster .cap{position:absolute;left:0;right:0;bottom:0;padding:56px clamp(12px,2.4vw,22px) clamp(12px,2.4vw,22px);background:linear-gradient(to top,rgba(5,6,16,.9),rgba(5,6,16,0));display:flex;flex-direction:column;gap:6px}
.poster h2{font:800 clamp(17px,3.6vw,30px)/1.05 var(--fd);letter-spacing:-.03em}
.poster p{font-size:clamp(12px,1.8vw,15px);color:rgba(255,255,255,.88);max-width:32ch}
.poster .go{margin-top:6px;font-size:clamp(12px,1.8vw,14px);font-weight:700;color:var(--kn)}
.poster .go::after{content:" →"}
.rsum{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rsum strong{font:800 40px/1 var(--fd);letter-spacing:-.03em}
.rsum span{color:#8E93AE;font-size:15px}
.stars{display:flex;gap:4px;color:#3E4368}
.stars svg{width:20px;height:20px;fill:currentColor}
.stars .on{color:#FFC93C}
.rlist{display:grid;gap:12px;margin-top:22px}
.ritem{padding:16px 18px;border-radius:14px;background:#141830;border:1px solid rgba(255,255,255,.06)}
.ritem .rh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ritem b{font-weight:700}
.ritem small{color:#7A7F9A;font-size:13px}
.ritem p{margin-top:8px;color:#D2D6E6;font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:#8E93AE;font-size:15px}
.foot{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;padding-top:28px;border-top:1px solid rgba(255,255,255,.08);color:#7A7F9A;font-size:14px}
.foot nav{display:flex;gap:18px}
.foot a{color:#E6E8F2;font-weight:600;text-decoration:none}
.foot a:hover{color:var(--kn)}

/* ===== gerbang ulasan (layar pembuka) ===== */
#gate{position:fixed;inset:0;z-index:50;background:var(--ink);overflow:auto;display:grid;place-items:center;padding:24px 20px}
#gate[hidden]{display:none}
.gwrap{width:100%;max-width:1040px;display:grid;gap:28px;align-items:center}
@media(min-width:760px){.gwrap{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px}}
.gpic{width:100%;justify-self:center}
.gpic .pic{aspect-ratio:4/5}
.gtext h1{font:500 clamp(20px,2.4vw,26px)/1.2 var(--fd);letter-spacing:-.01em}
.gform{margin-top:16px;display:grid;gap:8px}
.gform label{font-size:12.5px;font-weight:400;color:#9AA0BC}
.gform .stars{margin:2px 0 4px -4px}
.gform .stars button{width:34px;height:34px;display:grid;place-items:center;color:#3E4368}
.gform .stars button svg{width:22px;height:22px;fill:currentColor}
.gform .stars button.on{color:#FFC93C}
.gform input,.gform textarea{width:100%;font:400 14px var(--fb);color:#fff;background:#141830;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:9px 12px;outline:none}
.gform textarea{min-height:72px;resize:vertical}
.gform input:focus,.gform textarea:focus{border-color:rgba(242,176,30,.7)}
.gform input::placeholder,.gform textarea::placeholder{color:#6B7092}
.gbtn{justify-self:start;font:500 14px var(--fb);padding:10px 18px;border-radius:10px;background:var(--kn);color:#14161F;transition:opacity .2s}
.gbtn:disabled{opacity:.4;cursor:not-allowed}
.gmsg{font-size:12.5px;color:#A7ACC4;min-height:1.2em}
.gmsg.err{color:#FF9B7E}
/* story */
.story{position:fixed;inset:0;display:grid;place-items:center;background:#07080F;z-index:10}
.stage{position:relative;height:calc(100dvh - 32px);aspect-ratio:9/16;max-width:100vw;container-type:inline-size;--hudfg:#fff}
.frame{position:absolute;inset:0;overflow:hidden;border-radius:26px;background:#10121F;touch-action:pan-y;user-select:none;-webkit-user-select:none}
@media(max-width:600px){.stage{height:100dvh;width:100vw;aspect-ratio:auto}.frame{border-radius:0}}
.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(5%);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.7,.2,1),visibility 0s .45s;color:var(--fg)}
.slide.past{transform:translateX(-5%)}
.slide.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.slide:not(.on) *{animation-play-state:paused!important}
.scene{position:absolute;inset:0;width:100%;height:100%}
.copy{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:3cqw;padding:16cqw 6.5cqw max(8cqw,env(safe-area-inset-bottom))}
.dk .copy{background:linear-gradient(to top,rgba(4,5,16,.66) 0,rgba(4,5,16,.42) 58%,rgba(4,5,16,0))}
.kick{font:700 3.5cqw/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.copy h1,.copy h2{font-family:var(--fd);font-weight:800;letter-spacing:-.035em;line-height:1;text-wrap:balance}
.copy h1{font-size:12.4cqw}
.copy h2{font-size:9.6cqw}
.copy p{font-size:4.6cqw;line-height:1.42;max-width:34ch;color:color-mix(in srgb,var(--fg) 88%,transparent)}
.copy p.note{font-size:3.6cqw;color:color-mix(in srgb,var(--fg) 72%,transparent)}
.hint{display:flex;align-items:center;gap:2cqw;font-weight:700;font-size:3.8cqw;margin-top:1cqw}
.hint svg{width:5cqw;height:5cqw;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(1.6cqw)}}

.rows{display:grid;gap:2.4cqw}
.row{display:grid;grid-template-columns:22cqw minmax(0,1fr);gap:3cqw;padding-top:2.4cqw;border-top:1px solid color-mix(in srgb,var(--fg) 26%,transparent);align-items:baseline}
.row b{font:800 4.4cqw/1.1 var(--fd);color:var(--ac);letter-spacing:-.01em}
.row span{font-size:3.9cqw;line-height:1.35}
.rows.wide .row{grid-template-columns:25cqw minmax(0,1fr)}
.rows.stack .row{grid-template-columns:minmax(0,1fr);gap:.8cqw}
.rows.dest .row{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.rows.dest b{color:var(--fg);font-size:4.8cqw;display:block}
.rows.dest small{display:block;font-size:3.3cqw;color:color-mix(in srgb,var(--fg) 70%,transparent)}
.badge{display:inline-flex;align-items:center;gap:1.8cqw;font:700 3.4cqw var(--fb);padding:1.4cqw 3cqw;border-radius:99px;background:color-mix(in srgb,var(--fg) 14%,transparent);white-space:nowrap}
.badge::before{content:"";width:2.2cqw;height:2.2cqw;border-radius:50%;border:.6cqw solid var(--fg)}
.badge.s1::before{background:var(--fg)}
.badge.s2::before{box-shadow:inset 0 0 0 .5cqw var(--fg)}
.badge.s3::before{border-style:dashed}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:4cqw 5cqw}
.stats.r{grid-template-columns:1fr}
.stat{border-top:2px solid var(--fg);padding-top:2cqw}
.stat b{display:block;font:800 13cqw/1 var(--fd);color:var(--ac);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:1.2cqw;font-size:3.6cqw;line-height:1.35}
.stats.r .stat{display:grid;grid-template-columns:38cqw minmax(0,1fr);align-items:center;gap:3cqw}
.stats.r .stat b{font-size:13cqw}
.stats.r .stat span{margin:0;font-size:3.8cqw}

.btns{display:grid;gap:2.4cqw;margin-top:1cqw}
.btn{display:flex;justify-content:space-between;align-items:center;gap:3cqw;width:100%;padding:3.6cqw 5.4cqw;border-radius:99px;font:800 4.5cqw var(--fd);letter-spacing:-.01em}
.btn::after{content:"→"}
.dk .btn.p{background:#fff;color:#14161F}
.lt .btn.p{background:#14161F;color:#fff}
.btn.s{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--fg) 45%,transparent)}
.btn.s::after{content:"+"}

/* hud */
.hud{position:absolute;top:0;left:0;right:0;z-index:5;padding:max(10px,env(safe-area-inset-top)) 4cqw 0;color:var(--hudfg);pointer-events:none}
.hud button{pointer-events:auto}
.bars{display:flex;gap:1.2cqw}
.bars button{flex:1;height:calc(3px + 3.2cqw);padding:1.6cqw 0;background:color-mix(in srgb,var(--hudfg) 30%,transparent);background-clip:content-box;border-radius:9px;transition:background .3s}
.bars button.on{background:var(--hudfg);background-clip:content-box}
.top{display:flex;align-items:center;justify-content:space-between;margin-top:1cqw}
.chip{display:flex;align-items:center;gap:2cqw;font:700 3.6cqw var(--fb)}
.chip i{width:2.4cqw;height:2.4cqw;background:currentColor;transform:rotate(45deg)}
.x{width:9.5cqw;height:9.5cqw;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--hudfg) 16%,transparent)}
.x svg{width:5cqw;height:5cqw;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
.arrow{display:none;position:absolute;top:50%;width:48px;height:48px;margin-top:-24px;border-radius:50%;background:rgba(255,255,255,.1);place-items:center}
.arrow:hover{background:rgba(255,255,255,.2)}
.arrow svg{width:22px;height:22px;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.arrow.prev{left:-68px}.arrow.next{right:-68px}
.arrow[disabled]{opacity:.3;cursor:default}
@media(min-width:760px){.arrow{display:grid}}

.shade{position:absolute;inset:0;z-index:7;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.shade.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;max-height:80%;overflow:auto;background:#12142A;color:#fff;border-radius:5cqw 5cqw 0 0;padding:6cqw 6cqw max(7cqw,env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.7,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3cqw}
.sheet h3{font:800 6cqw var(--fd);letter-spacing:-.02em}
.sheet ol{padding-left:5cqw;font-size:3.7cqw;line-height:1.45;color:#B6BAD0;display:grid;gap:2.2cqw}
.sheet a:hover{color:#fff}
.sheet p{margin-top:4cqw;font-size:3.5cqw;color:#8B90A8}

/* animasi scene */
.slide.on .copy>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
.slide.on .row,.slide.on .stat{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--r,0)*80ms + 360ms)}
@keyframes rise{from{opacity:0;transform:translateY(5cqw)}}
.slide.on .mas{animation:pop .75s cubic-bezier(.2,1.4,.4,1) both .15s}
.slide.on .pp{animation:pop .6s cubic-bezier(.2,1.5,.4,1) both .35s}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(24px)}}
.mas,.pp{transform-box:fill-box;transform-origin:50% 100%}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hop{animation:hop 1.8s ease-in-out infinite}
@keyframes hop{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-16px)}}
.wave{animation:wave .9s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-26deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.fl{transform-box:fill-box;transform-origin:center;animation:fl 5s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-12px) rotate(14deg)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
.sh{animation:shim 4s ease-in-out infinite alternate}
@keyframes shim{to{opacity:.8}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steam{transform-box:fill-box;transform-origin:center;animation:steam 3.4s ease-out infinite;opacity:0}
@keyframes steam{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:.7}100%{transform:translateY(-70px) scale(1.4);opacity:0}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(1.18) scaleX(.9)}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.fly{animation:fly 3.6s ease-in-out infinite}
@keyframes fly{50%{transform:translateY(-9px) rotate(-1.4deg)}}
.dashmove{animation:dm 1.4s linear infinite}
@keyframes dm{to{stroke-dashoffset:-20}}
.shut{animation:shut 3.2s ease-in-out infinite alternate}
@keyframes shut{to{transform:translateX(200px)}}
.dip{animation:dip 2.6s ease-in-out infinite}
@keyframes dip{50%{transform:translateY(12px)}}
.popd{transform-box:fill-box;transform-origin:center;animation:popd 3s ease-in-out infinite}
@keyframes popd{0%,15%{transform:scale(0)}35%,85%{transform:scale(1)}100%{transform:scale(0)}}
.lbl{font:800 15px var(--fd);fill:var(--fg)}
.bt{font:800 44px var(--fd);letter-spacing:-.03em}
.pl{font:800 15px var(--fd);fill:#14161F}
.yr{font:800 20px var(--fd);fill:#fff}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

/* ---- mode animasi cerita ---- */
.bgk{animation:kb 14s ease-in-out infinite alternate;filter:hue-rotate(calc(var(--l,0)*8deg));transition:filter .9s}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.15) translate(-2%,-1.5%)}}
.scene.fg{transform-origin:50% 0;transform:translateY(14cqw) scale(1.06)}
.mas>g{transform-box:fill-box;transform-origin:50% 100%}
.slide[data-act] .mas>g{animation:talk .3s ease-in-out infinite alternate}
.slide[data-act=hop] .mas>g{animation:jp .6s ease-out infinite}
.slide[data-act=sway] .mas>g{animation:sw 1.2s ease-in-out infinite}
.slide[data-act=spin] .mas>g{transform-origin:50% 50%;animation:sp 1.1s cubic-bezier(.5,0,.3,1) 1 both}
.slide[data-act=grow] .mas>g{animation:gr .8s ease-in-out infinite alternate}
.slide[data-act=shake] .mas>g{animation:sk .16s linear infinite alternate}
@keyframes talk{to{transform:scale(.985,1.035)}}
@keyframes jp{0%,100%{transform:translateY(0) scale(1.04,.95)}45%{transform:translateY(-30px) scale(.97,1.04)}}
@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes gr{to{transform:scale(1.14)}}
@keyframes sk{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;align-items:center;gap:3.5cqw;padding:0 6cqw max(9cqw,env(safe-area-inset-bottom))}
.sub{text-align:center;font:800 6.2cqw/1.25 var(--fd);letter-spacing:-.02em;color:#fff;text-wrap:balance}
.cap{display:inline-block;background:rgba(8,10,28,.68);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:3cqw 4.5cqw;border-radius:5cqw}
.w{display:inline-block;opacity:.3;animation:wd .01s linear forwards;animation-delay:var(--d)}
.w.h{color:#FFD04F;animation:wd .01s linear forwards,hp .5s ease-out;animation-delay:var(--d),var(--d)}
@keyframes wd{to{opacity:1}}
@keyframes hp{50%{transform:scale(1.3)}}
.stk{position:absolute;left:50%;top:96cqw;z-index:3;padding:2cqw 5cqw;border-radius:4cqw;background:#FFD04F;color:#14161F;font:800 9cqw/1 var(--fd);letter-spacing:-.03em;white-space:nowrap;box-shadow:0 1.2cqw 0 rgba(0,0,0,.35);opacity:0;transform:translateX(-50%) scale(0)}
.stk.on{animation:stp .6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stp{from{opacity:0;transform:translateX(-50%) rotate(-14deg) scale(0)}to{opacity:1;transform:translateX(-50%) rotate(-4deg) scale(1)}}
.fx{position:absolute;left:50%;top:50cqw;z-index:2;pointer-events:none}
.fx i{position:absolute;width:3.4cqw;height:3.4cqw;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%);animation:bst .9s ease-out forwards}
@keyframes bst{from{opacity:1;transform:translate(0,0) scale(.3)}to{opacity:0;transform:translate(var(--x),var(--y)) rotate(220deg) scale(1)}}
.dock .btns{display:none;width:100%}
.slide.fin .btns{display:grid}
.btn[data-rp]::after{content:"↺"}
.tr{display:flex;gap:2cqw}
.bars button i{display:block;height:100%;width:0;background:var(--hudfg);border-radius:9px;transition:width .4s}
.pz .slide *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.w{opacity:1}}

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};

/* ---------- efek suara & musik latar (Web Audio, tanpa file luar) ---------- */
var SFX=(function(){
  var AX=window.AudioContext||window.webkitAudioContext,ctx=null,on=true,paused=false,open=false;
  var mst,dry,wet,mus,fx,musT=0,musOn=false,nextT=0,step=0,key="tahu",timers=[],vo=false;
  try{if(localStorage.getItem("kks_sfx")==="0")on=false}catch(e){}
  /* pentatonik mayor yang hangat; tenun sedikit lebih tinggi & lembut */
  var ROOT={tahu:261.63,tenun:293.66},PEN=[0,2,4,7,9];
  var CH={tahu:[[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17]],tenun:[[0,4,7,9],[5,9,12,14],[7,11,14,16],[4,7,11,14]]};
  function hz(deg,oct){var r=ROOT[key],o=Math.floor(deg/5),d=((deg%5)+5)%5;return r*Math.pow(2,(PEN[d]+12*(o+(oct||0)))/12)}
  function mk(){
    if(ctx||!AX)return;

    var cmp=ctx.createDynamicsCompressor();cmp.threshold.value=-18;cmp.ratio.value=4;cmp.attack.value=.01;cmp.release.value=.25;
    mst=ctx.createGain();mst.gain.value=on?.9:0;mst.connect(cmp);cmp.connect(ctx.destination);
    dry=ctx.createGain();dry.connect(mst);
    var cv=ctx.createConvolver(),len=ctx.sampleRate*2.2,buf=ctx.createBuffer(2,len,ctx.sampleRate),c,i,d;

    cv.buffer=buf;wet=ctx.createGain();wet.gain.value=.5;wet.connect(cv);cv.connect(mst);
    fx=ctx.createGain();fx.gain.value=1;fx.connect(dry);fx.connect(wet);
    mus=ctx.createGain();mus.gain.value=0;mus.connect(dry);var mw=ctx.createGain();mw.gain.value=.7;mus.connect(mw);mw.connect(wet);
  }
  function ok(){return ctx&&on&&ctx.state!=="closed"}
  function T(dt){return ctx.currentTime+(dt||0)}
  function later(ms,f){var t=setTimeout(f,ms);timers.push(t);if(timers.length>80)timers.shift()}
  function clear(){timers.forEach(clearTimeout);timers=[]}

  /* --- bunyi dasar --- */
  function env(g,t,a,pk,dur){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
  function bell(f,t,v,dur,out){ /* lonceng/gamelan lembut: partial sedikit tidak harmonis */
    var P=[[1,1],[2.01,.38],[2.76,.22],[5.4,.08]],g=ctx.createGain(),i,o,pg;
    dur=dur||1.3;g.connect(out||fx);env(g,t,.004,v,dur);

  }
  function pluck(f,t,v,dur,out){ /* marimba/kalimba */
    var g=ctx.createGain(),o=ctx.createOscillator(),o2=ctx.createOscillator(),g2=ctx.createGain();dur=dur||.5;
    o.type="triangle";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*4;g2.gain.value=.18;
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(out||fx);env(g,t,.003,v,dur);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05)
  }
  function noise(t,dur,f0,f1,v,q,type){
    var n=ctx.sampleRate*dur,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0),i;
    for(i=0;i<n;i++)d[i]=Math.random()*2-1;
    var s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    s.buffer=b;f.type=type||"bandpass";f.Q.value=q||1.2;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+dur*.4);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(fx);s.start(t);s.stop(t+dur+.02)
  }
  function sweep(f0,f1,t,dur,v,type){
    var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);

  }
  function pop(t,v,f){sweep(f||520,(f||520)*2.2,t,.09,v||.12)}
  function glitter(t,n,v,lo){ /* kilau: lonceng tinggi acak naik */
    var i,d=Math.floor(Math.random()*3);lo=lo||2;

  }
  function whoosh(t,dur,v,up){noise(t,dur,up?500:3200,up?3600:500,v||.09,.9)}
  function arp(t,degs,v,gap,oct,fn){degs.forEach(function(d,i){(fn||bell)(hz(d,oct||0),t+i*(gap||.09),v,1.1)})}

  /* --- aksi maskot --- */

    hi:function(t){arp(t,[7,9,12],.07,.1,0);glitter(t+.2,4,.04)},
    walk:function(t){pluck(hz(4,0),t,.07,.2);pluck(hz(5,0),t+.2,.06,.2)},
    talk:function(t){pluck(hz(7,0),t,.045,.25)},
    bow:function(t){bell(hz(2,0),t,.08,1.2);bell(hz(4,0),t+.12,.06,1.2)},
    dance:function(t){[0,2,4,2,5,4].forEach(function(d,i){pluck(hz(d+2,0),t+i*.13,.075,.3)});glitter(t+.5,3,.035)},
    flip:function(t){whoosh(t,.45,.08,1);sweep(380,900,t,.4,.07,"triangle");bell(hz(9,1),t+.42,.07,1)},
    shake:function(t){[0,1,2,3].forEach(function(i){pluck(hz(i%2?3:4,0),t+i*.08,.06,.18)})},
    think:function(t){bell(hz(3,-1),t,.07,1.4);bell(hz(5,-1),t+.35,.06,1.4);pop(t+.75,.05,330)},
    roll:function(t){[0,1,2,3,4,5,6].forEach(function(i){pluck(hz(i%5,0),t+i*.07,.05,.22)});whoosh(t,.6,.05,1)},
    cheer:function(t){arp(t,[4,7,9,12],.08,.075,0);glitter(t+.25,6,.05);noise(t,.5,3000,6000,.03,3,"highpass")},
    peek:function(t){pop(t,.1,380);bell(hz(8,0),t+.06,.07,.9)},
    boing:function(t){sweep(220,520,t,.14,.12);sweep(520,300,t+.14,.22,.09);bell(hz(9,0),t+.3,.05,.8)},
    stomp:function(t){sweep(150,55,t,.22,.2);noise(t,.15,900,200,.06,1,"lowpass");pluck(hz(0,-1),t+.04,.08,.4)},
    grow:function(t){sweep(260,880,t,.7,.07,"triangle");arp(t+.2,[0,2,4,7],.06,.15,0);glitter(t+.75,4,.04)},
    spinjump:function(t){whoosh(t,.5,.09,1);sweep(300,1100,t,.5,.06,"triangle");glitter(t+.5,5,.05)},
    swing:function(t){noise(t,.7,700,1700,.07,1.6);bell(hz(4,0),t+.1,.05,1);bell(hz(2,0),t+.55,.05,1)},
    sway:function(t){bell(hz(5,0),t,.06,1.4);bell(hz(3,0),t+.4,.05,1.4)},
    hop:function(t){sweep(240,640,t,.12,.11);pluck(hz(9,0),t+.1,.06,.3)},
    spin:function(t){whoosh(t,.55,.08,1);glitter(t+.15,6,.045)}
  };
  var FXV=[ /* variasi efek visual: ledakan kilau, cincin, gelembung, sinar */
    function(t){glitter(t,8,.055,2);bell(hz(12,0),t,.05,1.6)},
    function(t){bell(hz(7,0),t,.07,1.8);bell(hz(7,1),t+.16,.05,1.8);bell(hz(9,1),t+.32,.04,1.8)},
    function(t){for(var k=0;k<6;k++)pop(t+k*.07,.06,420+k*70)},
    function(t){arp(t,[9,12,14,16],.05,.06,1);noise(t,.5,5000,9000,.025,4,"highpass")}
  ];

  /* --- musik latar: gamelan-kalimba santai, loop tanpa henti --- */
  function sched(){
    if(!musOn||!ctx)return;
    var bpm=key==="tahu"?88:80,sb=60/bpm/2,ch=CH[key];
    while(nextT<ctx.currentTime+.6){
      var t=nextT,s=step%64,bar=Math.floor(s/16),c=ch[bar%4],k=s%16;
      if(k===0){ /* bantalan akor lembut */
        c.forEach(function(sem,i){
          var o=ctx.createOscillator(),g=ctx.createGain(),f=ROOT[key]*Math.pow(2,(sem-12)/12);
          o.type=i%2?"triangle":"sine";o.frequency.value=f;o.detune.value=(i-1.5)*5;o.connect(g);g.connect(mus);
          g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05,t+.9);g.gain.linearRampToValueAtTime(.03,t+sb*12);g.gain.exponentialRampToValueAtTime(.0001,t+sb*16);
          o.start(t);o.stop(t+sb*16+.1)})
      }
      if(k%2===0){ /* arpeggio kalimba */
        var n=c[(k/2)%c.length],f=ROOT[key]*Math.pow(2,n/12)*(k%8===0?1:2);
        pluck(f,t,k%8===0?.05:.032,.55,mus)
      }
      if(k===4||k===12||(k===9&&Math.random()<.5)){ /* kilau lonceng acak */
        if(Math.random()<.75)bell(hz(Math.floor(Math.random()*8)+2,1),t+.02,.03,1.6,mus)
      }
      if(k===0&&bar%2===0)bell(hz(0,-1),t,.06,2.4,mus); /* gong lembut */

    }

  }

    if(!ctx)return;musOn=false;clearInterval(musT);

  }

  /* --- API publik --- */

    unlock:function(){mk();if(ctx&&ctx.state==="suspended")ctx.resume();if(open&&on&&!paused)mStart()},
    start:function(k,v){mk();key=k;vo=!!v;open=true;paused=false;if(!ok())return;if(ctx.state==="suspended")ctx.resume();mStop(1);later(250,function(){if(open&&on&&!paused)mStart()});
      var t=T(.05);arp(t,[0,2,4,7,9],.07,.1,1);glitter(t+.4,8,.05,2);whoosh(t,.6,.06,1)},
    stop:function(){open=false;clear();if(ok()){mStop();var t=T();arp(t,[9,7,4,2],.05,.09,1)}},
    pause:function(p){paused=p;if(!ctx)return;if(p){mStop()}else if(open&&on)mStart()},
    toggle:function(){on=!on;try{localStorage.setItem("kks_sfx",on?"1":"0")}catch(e){}
      mk();if(!ctx)return on;if(mst)mst.gain.linearRampToValueAtTime(on?.9:0,ctx.currentTime+.15);

    isOn:function(){return on},
    voice:function(v){vo=!!v;if(ctx&&musOn){mus.gain.cancelScheduledValues(ctx.currentTime);mus.gain.linearRampToValueAtTime(vo?.5:.9,ctx.currentTime+.6)}},

    },
    move:function(o){
      if(!ok())return;var t=T(.05);
      if(o.rd){whoosh(t,1.6,.07,1);sweep(180,340,t,1.5,.035,"triangle");glitter(t+.6,6,.04,2)}

      else{for(var i=0;i<6;i++)pluck(hz([4,5,7,5,4,2][i],0),t+i*.22,.05,.22);noise(t,1.1,400,900,.03,.8,"lowpass")}

    },
    beat:function(o){ /* satu "napas" per baris cerita */

/* ---------- alat gambar low-poly ---------- */
function rnd(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function rgb(h){h=h.replace("#","");return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function h2(n){n=Math.max(0,Math.min(255,Math.round(n)));return(n<16?"0":"")+n.toString(16)}
function mix(a,b,t){var A=rgb(a),B=rgb(b);return"#"+[0,1,2].map(function(k){return h2(A[k]+(B[k]-A[k])*t)}).join("")}
function shade(c,v){return v>=0?mix(c,"#ffffff",v):mix(c,"#000000",-v)}
function P(pts,f,op){return'<polygon points="'+pts+'" fill="'+f+'"'+(op!=null?' opacity="'+op+'"':"")+'/>'}
function R(x,y,w,h){return x+","+y+" "+(x+w)+","+y+" "+(x+w)+","+(y+h)+" "+x+","+(y+h)}

function lowpoly(a,b,seed,W,H,cols,rows){
  var r=rnd(seed),pts=[],i,j,cw=W/cols,ch=H/rows,o="";
  for(j=0;j<=rows;j++){pts[j]=[];for(i=0;i<=cols;i++){
    var x=i*cw,y=j*ch;
    if(i>0&&i<cols)x+=(r()-.5)*cw*.7;
    if(j>0&&j<rows)y+=(r()-.5)*ch*.7;
    pts[j][i]=[x,y]}}
  function tri(p,q,s){
    var cx=(p[0]+q[0]+s[0])/3,cy=(p[1]+q[1]+s[1])/3,t=Math.min(1,Math.max(0,cy/H*.7+cx/W*.3));
    var f=shade(mix(a,b,t),(r()-.5)*.2);
    var pp=p.map(function(v){return v.toFixed(1)}).join(",")+" "+q.map(function(v){return v.toFixed(1)}).join(",")+" "+s.map(function(v){return v.toFixed(1)}).join(",");
    return'<polygon points="'+pp+'" fill="'+f+'" stroke="'+f+'" stroke-width=".6"'+(r()<.14?' class="sh" style="animation-delay:-'+(r()*4).toFixed(1)+'s"':"")+"/>";
  }
  for(j=0;j<rows;j++)for(i=0;i<cols;i++){
    var A=pts[j][i],B=pts[j][i+1],C=pts[j+1][i+1],D=pts[j+1][i];
    if((i+j)%2){o+=tri(A,B,D)+tri(B,C,D)}else{o+=tri(A,B,C)+tri(A,C,D)}
  }
  return o;
}

    o+=P(cx+","+cy+" "+(cx+Rr*Math.cos(a1)).toFixed(1)+","+(cy+Rr*Math.sin(a1)).toFixed(1)+" "+(cx+Rr*Math.cos(a2)).toFixed(1)+","+(cy+Rr*Math.sin(a2)).toFixed(1),shade(col,k%2?.18:-.08));

}

  var ch=$("#gch");if(ch)ch.insertAdjacentHTML("beforeend",'<b style="background:'+G.col[ct.n]+'">'+nm(ct.n)+"</b>");
  var gi=$("#gi");if(gi){gi.value="";gsugg("")}
  gdraw();
  if(ok){G.done=1;qsc++;f.textContent="Hijau! Benar, itu "+nm(ct.n)+". "+qS.g.ex;gfly(ct);gend();return}
  if(G.tries>=4){G.done=1;setTimeout(function(){SFX.ans(false)},650);G.TC.forEach(function(t){G.col[t.n]="#2FA66A"});f.textContent="Kesempatan habis. Jawabannya: "+G.TC.map(function(t){return nm(t.n)}).join(" atau ")+". "+qS.g.ex;gfly(G.TC[0]);gend();return}
  f.textContent=hlab(kmv)+": "+nm(ct.n)+(kmv<250?".":", sekitar "+km(dist)+" km dari jawaban.")+" Tebakan "+G.tries+" dari 4.";
  if(typed)gfly(ct,1);
}
function gend(){$("#qn").hidden=false;var a=$("#gf"),b=$("#gs");if(a)a.hidden=true;if(b)b.innerHTML="";var i=$("#gi");if(i)i.blur()}
function gtype(){
  var i=$("#gi");if(!i||GL.done)return;var v=i.value.trim();if(!v)return;var ct=gfind(v);
  if(!ct){$("#qf").textContent='"'+v+'" belum dikenali. Pilih dari saran di atas, coba ejaan lain, atau ketuk langsung di globe.';return}
  gguess(ct,1);
}
function gfly(t,mild){
  SFX.fly();var G=GL,id=++G.fly,k1=mild?Math.max(G.k,t.s<8?3:1):Math.max(G.k,t.s<8?4:2),n=0,L0=G.L,f0=G.f,k0=G.k,dl=((t.cx-L0+540)%360)-180;
  (function st(){if(G.fly!==id||!G.c||!G.c.parentNode)return;n++;var u=n/50,e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;G.L=L0+dl*e;G.f=f0+(Math.max(-60,Math.min(60,t.cy))-f0)*e;G.k=k0+(k1-k0)*e;gdraw();if(n<50)requestAnimationFrame(st)})();
}
qz.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-qx"))qclose();
  else if(b.hasAttribute("data-qa"))qans(b);
  else if(b.id==="qn"){qi++;qshow()}
  else if(b.hasAttribute("data-z"))gz(+b.getAttribute("data-z"));
  else if(b.hasAttribute("data-qr"))qopen();
  else if(b.hasAttribute("data-gr")){WST=0;loadWorld();qshow()}
  else if(b.hasAttribute("data-gf")){var g=qS.g;qchoice(g.t.replace(/ Putar globe.*$/,"")+" (Pilih jawabannya.)",g.F,g.fa,g.ex)}
  else if(b.hasAttribute("data-gs")){var c=WG.filter(function(x){return x.n===b.getAttribute("data-gs")})[0];if(c)gguess(c,1)}
});
qz.addEventListener("submit",function(e){e.preventDefault();gtype()});
qz.addEventListener("input",function(e){if(e.target.id==="gi")gsugg(e.target.value)});
document.addEventListener("click",function(e){if(e.target.closest("[data-quiz]"))qopen()});
addEventListener("resize",function(){if(!qz.hidden&&GL.c)gsize()});
function fromHash(){
  var m=location.hash.match(/^#(tahu|tenun)(?:\/(\d+))?$/);
  if(m)openStory(m[1],(+m[2]||1)-1,true);else if(!story.hidden)closeStory();
}
addEventListener("hashchange",function(){var m=location.hash.match(/^#(tahu|tenun)(?:\/(\d+))?$/);if(m&&(m[1]!==curKey||story.hidden))fromHash();else if(!m&&!story.hidden)closeStory()});
fromHash();
})();
</script>
<script>
(function(){
"use strict";
var C=window.CONFIG||{},P=C.poster||{},$=function(q){return document.querySelector(q)};
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function img(u){u=String(u||"").trim();return/^(https?:\/\/|\.?\/?[\w\-\/]+\.(jpe?g|png|webp|gif|avif|svg))/i.test(u)?u:""}
function web(u){u=String(u||"").trim();return/^https?:\/\//i.test(u)?u:""}
var STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.2 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
var URL_=web(C.ulasan),LOCAL="kks_ulasan",DONE="kks_gate";
var src=img(P.gambar),link=web(P.ig)||web(C.instagram),t=esc(P.judul||"Poster");
function picHTML(){return(src?'<img src="'+esc(src)+'" alt="'+t+'" decoding="async">':"")+'<span class="ph"'+(src?" hidden":"")+'><b>'+t+'</b>Tempel link gambar di bagian CONFIG</span>'+(link?'<span class="tag">Lihat di Instagram</span>':"")}
function wirePic(root){var im=root.querySelector("img");if(im)im.addEventListener("error",function(){im.remove();var ph=root.querySelector(".ph");if(ph)ph.hidden=false})}
/* poster di beranda & gerbang */
$("#mine").innerHTML=(link?'<a class="pic" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer" aria-label="Buka poster di Instagram">':'<div class="pic">')+picHTML()+(link?"</a>":"</div>");
wirePic($("#mine"));
$("#gpic").innerHTML='<div class="pic">'+picHTML()+"</div>";wirePic($("#gpic"));

/* sosial media */
var IC={
 ig:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg>',
 tt:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 2h-3.2v13.2a2.9 2.9 0 11-2.9-2.9c.3 0 .6 0 .8.1V9.1a6.1 6.1 0 105.3 6V8.6a7.6 7.6 0 004.4 1.4V6.8a4.4 4.4 0 01-4.4-4.8z"/></svg>',
 em:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>'};
var h="",mail=String(C.email||"").trim();
if(web(C.instagram))h+='<a href="'+esc(web(C.instagram))+'" target="_blank" rel="noopener noreferrer">Instagram</a>';
if(web(C.tiktok))h+='<a href="'+esc(web(C.tiktok))+'" target="_blank" rel="noopener noreferrer">TikTok</a>';
if(/^[^\s@<>"]+@[^\s@<>"]+\.[^\s@<>"]+$/.test(mail))h+='<a href="mailto:'+esc(mail)+'">Email</a>';
$("#soc").innerHTML=h;$("#soc2").innerHTML=h;

/* ulasan: data + tampilan */
var list=[];
function fmt(w){try{return new Date(w).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}catch(e){return""}}
function starsHTML(n){var o="",k;for(k=1;k<=5;k++)o+=STAR.replace('<svg ','<svg class="'+(k<=n?"on":"")+'" ');return'<span class="stars" aria-label="'+n+' dari 5 bintang">'+o+"</span>"}
function loadList(cb){
  if(!URL_){try{list=JSON.parse(localStorage.getItem(LOCAL)||"[]")}catch(e){list=[]}cb&&cb();return}
  fetch(URL_).then(function(r){return r.json()}).then(function(d){list=Array.isArray(d)?d:[];cb&&cb()}).catch(function(){list=[];cb&&cb()});
}
function renderReviews(){
  var n=list.length,avg=n?list.reduce(function(a,x){return a+(+x.bintang||0)},0)/n:0;
  $("#rsum").innerHTML=n?'<strong>'+avg.toFixed(1)+'</strong><span>dari 5 · '+n+' ulasan</span>':'<span>Belum ada ulasan.</span>';
  $("#rlist").innerHTML=list.slice().reverse().map(function(x){var b=Math.max(0,Math.min(5,+x.bintang||0));return'<article class="ritem"><div class="rh"><b>'+esc(x.nama||"Anonim")+'</b>'+starsHTML(b)+'</div>'+(x.ulasan?"<p>"+esc(x.ulasan)+"</p>":"")+'<small>'+esc(fmt(x.waktu))+"</small></article>"}).join("");
}

/* gerbang: wajib menilai sebelum masuk */
var gate=$("#gate"),sel=0,gst=$("#gst"),gb=$("#gb"),gm=$("#gm");
var sb="";for(var k=1;k<=5;k++)sb+='<button type="button" role="radio" aria-checked="false" aria-label="'+k+' bintang" data-k="'+k+'">'+STAR+"</button>";
gst.innerHTML=sb;
function paintStars(){Array.prototype.forEach.call(gst.children,function(x,n){x.classList.toggle("on",n<sel);x.setAttribute("aria-checked",n+1===sel)});gb.disabled=!sel}
gst.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;sel=+b.getAttribute("data-k");paintStars()});
function enter(){gate.hidden=true;document.body.style.overflow="";}
try{if(localStorage.getItem(DONE)==="1")gate.hidden=true;else document.body.style.overflow="hidden"}catch(e){document.body.style.overflow="hidden"}
$("#gf").addEventListener("submit",function(e){
  e.preventDefault();if(!sel)return;
  var rec={nama:($("#gn").value||"").trim().slice(0,40)||"Anonim",bintang:sel,ulasan:($("#gx").value||"").trim().slice(0,400),waktu:new Date().toISOString()};
  gb.disabled=true;gm.className="gmsg";gm.textContent="Mengirim...";
  function done(){try{localStorage.setItem(DONE,"1")}catch(x){}enter();}
  if(!URL_){
    list.push(rec);try{localStorage.setItem(LOCAL,JSON.stringify(list))}catch(x){}
    renderReviews();done();return;
  }
  fetch(URL_,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)})
    .then(function(){list.push(rec);renderReviews();done()})
    .catch(function(){gb.disabled=false;gm.className="gmsg err";gm.textContent="Gagal mengirim. Coba lagi ya."});
});

/* poster cerita */
document.addEventListener("click",function(e){var g=e.target.closest("[data-go]");if(!g)return;var el=document.getElementById(g.getAttribute("data-go"));if(el)el.scrollIntoView({behavior:"smooth"})});

loadList(renderReviews);
})();
</script>
</body>
